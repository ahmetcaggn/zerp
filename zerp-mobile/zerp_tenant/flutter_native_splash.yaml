# Flutter Native Splash Configuration
# https://pub.dev/packages/flutter_native_splash
#
# Run the following command to generate the splash screen:
#   dart run flutter_native_splash:create

flutter_native_splash:
  # ─── Android Only ───────────────────────────────────────────────────────────
  # Disable iOS and web so only Android is generated
  android: true
  ios: false
  web: false

  # ─── Background color ────────────────────────────────────────────────────────
  # Solid background color shown behind the splash logo.
  # Replace with your brand color once confirmed.
  color: "#FFFFFF"

  # Dark-mode background (optional – remove if you don't want a separate dark splash)
  # color_dark: "#121212"

  # ─── Splash logo ─────────────────────────────────────────────────────────────
  # Uncomment and set the path when the image is ready.
  # The image should be a PNG, ideally 288 × 288 dp (1x) or use the 3x source
  # at 864 × 864 px so Flutter can down-scale it automatically.
  #
  # image: assets/images/splash_logo.png
  # image_dark: assets/images/splash_logo_dark.png

  # ─── Branding image (bottom of screen, Android 12+ only) ────────────────────
  # Shown at the bottom of the splash. Useful for a wordmark / tagline.
  #
  # android_12:
  #   image: assets/images/splash_logo.png
  #   image_dark: assets/images/splash_logo_dark.png
  #   color: "#FFFFFF"
  #   color_dark: "#121212"
  #   icon_background_color: "#FFFFFF"
  #   icon_background_color_dark: "#121212"

  # ─── Android-specific tweaks ─────────────────────────────────────────────────
  # Keep the native splash visible until Flutter signals it is ready
  # (avoids a white flash between the splash and first frame).
  fullscreen: false

  # Gravity of the splash image: center | fill | bottom | bottomRight | etc.
  # android_gravity: center

  # Disable (comment out) if you do NOT want the package to touch styles.xml
  # android_disable_v2: false
