name: zerp_tenant
description: "The mobile application for zerp firms."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  auto_route: ^11.1.0
  dart_network_layer_dio: ^1.0.0-dev9
  device_info_plus: ^12.4.0
  dio: ^5.9.0
  easy_localization: ^3.0.8
  equatable: ^2.0.7
  flutter:
    sdk: flutter
  flutter_appauth: ^12.0.0
  flutter_bloc: ^9.1.1
  flutter_secure_storage: ^10.0.0
  freezed_annotation: ^3.1.0
  get_it: ^9.1.0
  injectable: ^2.7.1+4
  json_annotation: ^4.11.0
  jwt_decoder: ^2.0.1
  logging: ^1.3.0
  meta: any
  openapi_crm:
    path: modules/openapi_crm
  openapi_employee:
    path: modules/openapi_employee
  openapi_notification:
    path: modules/openapi_notification
  path_provider: ^2.1.5
  remote_logging:
    path: modules/remote_logging
  sembast: ^3.8.6
  uuid: ^4.5.3

dev_dependencies:
  auto_route_generator: ^10.5.0
  build_runner: ^2.10.1
  flutter_test:
    sdk: flutter
  freezed: ^3.2.5
  injectable_generator: ^2.12.1
  json_serializable: ^6.13.1
  very_good_analysis: ^10.2.0

flutter:
  uses-material-design: true
