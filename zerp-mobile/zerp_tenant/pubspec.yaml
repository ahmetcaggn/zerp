name: zerp_tenant
description: "The mobile application for zerp firms."
publish_to: 'none'

version: 0.1.8+9

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  meta: any

  # Management
  auto_route: ^11.1.0
  flutter_appauth: ^12.0.0
  flutter_bloc: ^9.1.1

  # Localization
  flutter_localizations:
    sdk: flutter
  slang: ^4.14.0
  slang_flutter: ^4.14.0

  # Network
  openapi_crm:
    path: modules/openapi_crm
  openapi_employee:
    path: modules/openapi_employee
  openapi_notification:
    path: modules/openapi_notification
  openapi_resource:
    path: modules/openapi_resource
  openapi_sale:
    path: modules/openapi_sale
  openapi_suggestion:
    path: modules/openapi_suggestion
  openapi_user:
    path: modules/openapi_user
  dart_network_layer_dio: 1.0.0-dev.12
  dio: ^5.9.0

  # Storage
  sembast: ^3.8.6
  flutter_secure_storage: ^10.0.0

  # Serde
  json_annotation: ^4.11.0
  jwt_decoder: ^2.0.1
  equatable: ^2.0.7
  freezed_annotation: ^3.1.0

  # Logging
  remote_logging:
    path: modules/remote_logging
  logging: ^1.3.0

  # Dependency Injection
  get_it: ^9.1.0
  injectable: ^2.7.1+4

  # Utilities
  path_provider: ^2.1.5
  uuid: ^4.5.3
  device_info_plus: ^12.4.0
  mobile_scanner: ^7.2.0
  intl: ^0.20.2
  url_launcher: ^6.3.2

dev_dependencies:
  auto_route_generator: ^10.5.0
  build_runner: ^2.10.1
  flutter_test:
    sdk: flutter
  freezed: ^3.2.5
  injectable_generator: ^2.12.1
  json_serializable: ^6.13.1
  slang_build_runner: ^4.14.0
  very_good_analysis: ^10.2.0
  http_test_server: ^0.1.1
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

  assets:
    - assets/images/
