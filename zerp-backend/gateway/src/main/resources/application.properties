spring.application.name=gateway

spring.config.import=optional:file:local/gateway.properties[.properties]

# overridden in local properties
server.port=8080

logging.config=classpath:log4j2.xml

springdoc.swagger-ui.path=/swagger-ui/index.html
springdoc.api-docs.path=/v3/api-docs

springdoc.swagger-ui.urls[0].name=CRM API
springdoc.swagger-ui.urls[0].url=/crm/v3/api-docs
springdoc.swagger-ui.urls[1].name=Employee API
springdoc.swagger-ui.urls[1].url=/employee/v3/api-docs
springdoc.swagger-ui.urls[2].name=Notification API
springdoc.swagger-ui.urls[2].url=/email/v3/api-docs

