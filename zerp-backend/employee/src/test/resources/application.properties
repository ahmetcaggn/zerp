# ?? Test configuration ???????????????????????????????????????????????????????
# Overrides main application.properties so mvn package never needs a real DB.

# Clear the local-file import (working dir during tests is employee/, not project root)
spring.config.import=

# H2 in-memory datasource
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Disable Eureka so the test context doesn't try to reach a registry
eureka.client.enabled=false
spring.cloud.discovery.enabled=false

# Kafka ? minimal config; context loads without a live broker
spring.kafka.bootstrap-servers=localhost:9092

# Mail ? host must be set but no real connection is made at startup
spring.mail.host=localhost
spring.mail.port=1025

