spring.application.name=crm

app.version=${APP_VERSION:0.0.1-SNAPSHOT}

spring.config.import=optional:file:local/crm.properties[.properties]

# Postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

server.port=8081

logging.config=classpath:log4j2.xml

openapi.server-urls=${OPENAPI_SERVER_URLS:http://localhost:8080/}

s3.repository.bucket-name=${MINIO_BUCKET_NAME:zerp-images}
s3.repository.username=${MINIO_ROOT_USER:admin}
s3.repository.password=${MINIO_ROOT_PASSWORD}
s3.repository.endpoint=${MINIO_ENDPOINT:http://localhost:9000}

user.thumbor.host=${THUMBOR_HOST:http://localhost:8000/}

# Actuator & Prometheus monitoring config
management.endpoints.web.exposure.include=health,info,prometheus
management.prometheus.metrics.export.enabled=true


