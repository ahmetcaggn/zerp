spring.config.import=optional:file:local/socket.properties[.properties]
spring.application.name=socket-service
spring.kafka.listener.missing-topics-fatal=false

app.socket.namespace=socket-service
app.socket.instance-id=${spring.application.name}:${HOSTNAME:${random.uuid}}
app.socket.endpoint=/ws
app.socket.allowed-origin-patterns=http://localhost:3000
app.socket.identity-header=x-user-id
app.socket.tenant-header=x-tenant-id
app.socket.session-timeout-seconds=90
app.socket.node-heartbeat-interval-seconds=10
app.socket.node-heartbeat-ttl-seconds=30
app.socket.cleanup-interval-seconds=30
app.socket.maintenance-enabled=true
app.socket.topic-prefix=/topic
app.socket.kafka.enabled=true
app.socket.kafka.topic=websocket-notifications
app.socket.kafka.consumer-group-prefix=socket-service
app.socket.kafka.auto-offset-reset=latest
app.socket.kafka.concurrency=1
app.socket.rate-limit.max-messages=120
app.socket.rate-limit.window-seconds=60

management.endpoints.web.exposure.include=health,info,prometheus
management.prometheus.metrics.export.enabled=true


