spring.application.name=sale

server.port=8080
server.tomcat.threads.max=${SALE_TOMCAT_THREADS_MAX:50}
server.tomcat.threads.min-spare=${SALE_TOMCAT_THREADS_MIN_SPARE:5}

# Postgres config
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:postgres}:${POSTGRES_PORT:5432}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${SALE_DB_POOL_MAX:5}
spring.datasource.hikari.minimum-idle=${SALE_DB_POOL_MIN_IDLE:3}
spring.datasource.hikari.idle-timeout=${SALE_DB_POOL_IDLE_TIMEOUT:30000}
spring.datasource.hikari.max-lifetime=${SALE_DB_POOL_MAX_LIFETIME:1800000}

eureka.client.service-url.defaultZone=${EUREKA_DEFAULT_ZONE:http://eureka:8761/eureka/}

user.thumbor.host=${THUMBOR_HOST:http://thumbor:8888}
s3.repository.endpoint=${MINIO_ENDPOINT:http://minio:9000}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
