spring.application.name=notification

server.port=8080
server.tomcat.threads.max=${NOTIFICATION_TOMCAT_THREADS_MAX:50}
server.tomcat.threads.min-spare=${NOTIFICATION_TOMCAT_THREADS_MIN_SPARE:5}

# Postgres config
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:postgres}:${POSTGRES_PORT:5432}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${NOTIFICATION_DB_POOL_MAX:5}
spring.datasource.hikari.minimum-idle=${NOTIFICATION_DB_POOL_MIN_IDLE:3}
spring.datasource.hikari.idle-timeout=${NOTIFICATION_DB_POOL_IDLE_TIMEOUT:30000}
spring.datasource.hikari.max-lifetime=${NOTIFICATION_DB_POOL_MAX_LIFETIME:1800000}

# Mail config
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}

kafka.url=${KAFKA_BOOTSTRAP:kafka:9092}
kafka.topic.email=${KAFKA_TOPIC_EMAIL:email-notifications}

eureka.client.service-url.defaultZone=${EUREKA_DEFAULT_ZONE:http://eureka:8761/eureka/}

user.thumbor.host=${THUMBOR_HOST:http://thumbor:8888}
s3.repository.endpoint=${MINIO_ENDPOINT:http://minio:9000}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
