spring.application.name=user

server.port=8080
server.tomcat.threads.max=${USER_TOMCAT_THREADS_MAX:50}
server.tomcat.threads.min-spare=${USER_TOMCAT_THREADS_MIN_SPARE:5}

# Postgres config
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:postgres}:${POSTGRES_PORT:5432}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${USER_DB_POOL_MAX:5}
spring.datasource.hikari.minimum-idle=${USER_DB_POOL_MIN_IDLE:3}
spring.datasource.hikari.idle-timeout=${USER_DB_POOL_IDLE_TIMEOUT:30000}
spring.datasource.hikari.max-lifetime=${USER_DB_POOL_MAX_LIFETIME:1800000}

eureka.client.service-url.defaultZone=${EUREKA_DEFAULT_ZONE:http://eureka:8761/eureka/}

keycloak.admin.server-url=${KEYCLOAK_ADMIN_SERVER_URL:}
keycloak.admin.realm=${KEYCLOAK_ADMIN_REALM:zerp}
keycloak.admin.client-id=${KEYCLOAK_ADMIN_CLIENT_ID:zerp-admin-cli}
keycloak.admin.client-secret=${KEYCLOAK_ADMIN_CLIENT_SECRET:}

user.thumbor.host=${THUMBOR_HOST:http://thumbor:8888}
s3.repository.endpoint=${MINIO_ENDPOINT:http://minio:9000}

app.prometheus.base-url=${PROMETHEUS_BASE_URL:http://prometheus:9090}
app.prometheus.max-range-seconds=${PROMETHEUS_MAX_RANGE_SECONDS:604800}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
