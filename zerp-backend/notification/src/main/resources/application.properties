spring.application.name=notification

app.version=${APP_VERSION:0.0.1-SNAPSHOT}

spring.config.import=optional:file:local/notification.properties[.properties]

server.port=8083

spring.datasource.driver-class-name=org.postgresql.Driver

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

logging.config=classpath:log4j2.xml

kafka.url=${KAFKA_BOOTSTRAP:kafka:9092}
kafka.topic.email=${KAFKA_TOPIC_EMAIL:email-notifications}
openapi.server-urls=${OPENAPI_SERVER_URLS:http://localhost:8080/}

# Actuator & Prometheus monitoring config
management.endpoints.web.exposure.include=health,info,prometheus
management.prometheus.metrics.export.enabled=true


