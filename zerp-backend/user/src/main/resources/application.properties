spring.application.name=user

app.version=${APP_VERSION:0.0.1-SNAPSHOT}

spring.config.import=optional:file:local/user.properties[.properties]

# Postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

server.port=8087

logging.config=classpath:log4j2.xml

keycloak.admin.server-url=${KEYCLOAK_ADMIN_SERVER_URL}
keycloak.admin.realm=${KEYCLOAK_ADMIN_REALM:zerp}
keycloak.admin.client-id=${KEYCLOAK_ADMIN_CLIENT_ID:zerp-admin-cli}
keycloak.admin.client-secret=${KEYCLOAK_ADMIN_CLIENT_SECRET}

openapi.server-urls=${OPENAPI_SERVER_URLS:http://localhost:8080/}

s3.repository.endpoint=${MINIO_ENDPOINT}
s3.repository.bucket-name=${MINIO_BUCKET_NAME}
s3.repository.username=${MINIO_ROOT_USER}
s3.repository.password=${MINIO_ROOT_PASSWORD}

user.thumbor.host=${THUMBOR_HOST}
app.user.tenant-images.folder=${USER_TENANT_IMAGES_FOLDER:tenant-images}
