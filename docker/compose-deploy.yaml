services:
  eureka:
    build:
      context: ..
      dockerfile: zerp-backend/docker/deploy.dockerfile
      args:
        SERVICE: eureka
    container_name: zerp-eureka
    hostname: eureka
    ports:
      - "${EUREKA_PORT}:8761"
    environment:
      TZ: Europe/Istanbul
      SERVICE: eureka
      MODULE_NAME: eureka
      SPRING_PROFILES_ACTIVE: ${EUREKA_SPRING_PROFILES_ACTIVE}
      LOG4J2_CONFIG_PATH: ${EUREKA_LOG4J2_CONFIG_PATH}
      JAVA_OPTS: ${EUREKA_JAVA_OPTS}
      spring.config.import: optional:file:/config/eureka.properties
    volumes:
      - ../zerp-backend/local/docker-config/eureka.docker.properties:/config/eureka.properties:ro
    networks:
      - zerp-net

  crm:
    build:
      context: ..
      dockerfile: zerp-backend/docker/deploy.dockerfile
      args:
        SERVICE: crm
    container_name: zerp-crm
    hostname: crm
    ports:
      - "8081:8081"
    environment:
      TZ: Europe/Istanbul
      SERVICE: crm
      MODULE_NAME: crm
      SPRING_PROFILES_ACTIVE: ${CRM_SPRING_PROFILES_ACTIVE}
      LOG4J2_CONFIG_PATH: ${CRM_LOG4J2_CONFIG_PATH}
      JAVA_OPTS: ${CRM_JAVA_OPTS}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      EUREKA_DEFAULT_ZONE: ${EUREKA_DEFAULT_ZONE}
      app.image.baseUrl: ${IMAGE_SERVER_URL:-https://www.zerp.com/api}
      s3.repository.endpoint: http://minio:9000
      user.thumbor.host: http://thumbor:8888
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-zerp-images}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-admin1234}
      spring.config.import: optional:file:/config/crm.properties
    volumes:
      - ../zerp-backend/local/docker-config/crm.docker.properties:/config/crm.properties:ro
    depends_on:
      - eureka
    networks:
      - zerp-net

  employee:
    build:
      context: ..
      dockerfile: zerp-backend/docker/deploy.dockerfile
      args:
        SERVICE: employee
    container_name: zerp-employee
    hostname: employee
    ports:
      - "8082:8082"
    environment:
      TZ: Europe/Istanbul
      SERVICE: employee
      MODULE_NAME: employee
      SPRING_PROFILES_ACTIVE: ${EMPLOYEE_SPRING_PROFILES_ACTIVE}
      LOG4J2_CONFIG_PATH: ${EMPLOYEE_LOG4J2_CONFIG_PATH}
      JAVA_OPTS: ${EMPLOYEE_JAVA_OPTS}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      EUREKA_DEFAULT_ZONE: ${EUREKA_DEFAULT_ZONE}
      spring.config.import: optional:file:/config/employee.properties
    volumes:
      - ../zerp-backend/local/docker-config/employee.docker.properties:/config/employee.properties:ro
    depends_on:
      - eureka
    networks:
      - zerp-net

  notification:
    build:
      context: ..
      dockerfile: zerp-backend/docker/deploy.dockerfile
      args:
        SERVICE: notification
    container_name: zerp-notification
    hostname: notification
    ports:
      - "8083:8083"
    environment:
      TZ: Europe/Istanbul
      SERVICE: notification
      MODULE_NAME: notification
      SPRING_PROFILES_ACTIVE: ${NOTIFICATION_SPRING_PROFILES_ACTIVE}
      LOG4J2_CONFIG_PATH: ${NOTIFICATION_LOG4J2_CONFIG_PATH}
      JAVA_OPTS: ${NOTIFICATION_JAVA_OPTS}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      EUREKA_DEFAULT_ZONE: ${EUREKA_DEFAULT_ZONE}
      KAFKA_BOOTSTRAP: ${KAFKA_BOOTSTRAP}
      KAFKA_TOPIC_EMAIL: ${KAFKA_TOPIC_EMAIL}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      spring.config.import: optional:file:/config/notification.properties
    volumes:
      - ../zerp-backend/local/docker-config/notification.docker.properties:/config/notification.properties:ro
    depends_on:
      - eureka
    networks:
      - zerp-net

  resource:
    build:
      context: ..
      dockerfile: zerp-backend/docker/deploy.dockerfile
      args:
        SERVICE: resource
    container_name: zerp-resource
    hostname: resource
    ports:
      - "8084:8084"
    environment:
      TZ: Europe/Istanbul
      SERVICE: resource
      MODULE_NAME: resource
      SPRING_PROFILES_ACTIVE: ${RESOURCE_SPRING_PROFILES_ACTIVE}
      LOG4J2_CONFIG_PATH: ${RESOURCE_LOG4J2_CONFIG_PATH}
      JAVA_OPTS: ${RESOURCE_JAVA_OPTS}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      EUREKA_DEFAULT_ZONE: ${EUREKA_DEFAULT_ZONE}
      spring.config.import: optional:file:/config/resource.properties
    volumes:
      - ../zerp-backend/local/docker-config/resource.docker.properties:/config/resource.properties:ro
    depends_on:
      - eureka
    networks:
      - zerp-net

  sale:
    build:
      context: ..
      dockerfile: zerp-backend/docker/deploy.dockerfile
      args:
        SERVICE: sale
    container_name: zerp-sale
    hostname: sale
    ports:
      - "8085:8085"
    environment:
      TZ: Europe/Istanbul
      SERVICE: sale
      MODULE_NAME: sale
      SPRING_PROFILES_ACTIVE: ${SALE_SPRING_PROFILES_ACTIVE}
      LOG4J2_CONFIG_PATH: ${SALE_LOG4J2_CONFIG_PATH}
      JAVA_OPTS: ${SALE_JAVA_OPTS}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      EUREKA_DEFAULT_ZONE: ${EUREKA_DEFAULT_ZONE}
      spring.config.import: optional:file:/config/sale.properties
    volumes:
      - ../zerp-backend/local/docker-config/sale.docker.properties:/config/sale.properties:ro
    depends_on:
      - eureka
    networks:
      - zerp-net

  suggestion:
    build:
      context: ..
      dockerfile: zerp-backend/docker/deploy.dockerfile
      args:
        SERVICE: suggestion
    container_name: zerp-suggestion
    hostname: suggestion
    ports:
      - "8086:8086"
    environment:
      TZ: Europe/Istanbul
      SERVICE: suggestion
      MODULE_NAME: suggestion
      SPRING_PROFILES_ACTIVE: ${SUGGESTION_SPRING_PROFILES_ACTIVE}
      LOG4J2_CONFIG_PATH: ${SUGGESTION_LOG4J2_CONFIG_PATH}
      JAVA_OPTS: ${SUGGESTION_JAVA_OPTS}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
