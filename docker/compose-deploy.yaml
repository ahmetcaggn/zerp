      spring.config.import: optional:file:/config/suggestion.properties
    volumes:
      - ../zerp-backend/local/docker-config/suggestion.docker.properties:/config/suggestion.properties:ro
    depends_on:
      - eureka
    networks:
      - zerp-net

  user:
    build:
      context: ..
      dockerfile: zerp-backend/docker/deploy.dockerfile
      args:
        SERVICE: user
    container_name: zerp-user
    hostname: user
    ports:
      - "8087:8087"
    environment:
      TZ: Europe/Istanbul
      SERVICE: user
      MODULE_NAME: user
      SPRING_PROFILES_ACTIVE: ${USER_SPRING_PROFILES_ACTIVE}
      LOG4J2_CONFIG_PATH: ${USER_LOG4J2_CONFIG_PATH}
      JAVA_OPTS: ${USER_JAVA_OPTS}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      EUREKA_DEFAULT_ZONE: ${EUREKA_DEFAULT_ZONE}
      KEYCLOAK_ADMIN_SERVER_URL: ${KEYCLOAK_ADMIN_SERVER_URL}
      KEYCLOAK_ADMIN_REALM: ${KEYCLOAK_ADMIN_REALM}
      KEYCLOAK_ADMIN_CLIENT_ID: ${KEYCLOAK_ADMIN_CLIENT_ID}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
      spring.config.import: optional:file:/config/user.properties
    volumes:
      - ../zerp-backend/local/docker-config/user.docker.properties:/config/user.properties:ro
    depends_on:
      - eureka
    networks:
      - zerp-net

  gateway:
    build:
      context: ..
      dockerfile: zerp-backend/docker/deploy.dockerfile
      args:
        SERVICE: gateway
    container_name: zerp-gateway
    hostname: gateway
    ports:
      - "${GATEWAY_PORT}:8080"
    environment:
      TZ: Europe/Istanbul
      SERVICE: gateway
      MODULE_NAME: gateway
      SPRING_PROFILES_ACTIVE: ${GATEWAY_SPRING_PROFILES_ACTIVE}
      LOG4J2_CONFIG_PATH: ${GATEWAY_LOG4J2_CONFIG_PATH}
      JAVA_OPTS: ${GATEWAY_JAVA_OPTS}
      EUREKA_DEFAULT_ZONE: ${EUREKA_DEFAULT_ZONE}
