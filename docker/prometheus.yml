global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'eureka'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: [ 'eureka:8761']

  # - job_name: 'gateway'
  #   metrics_path: '/actuator/prometheus'
  #   static_configs:
  #     - targets: ['zerp-gateway:8080', 'gateway:8080']

  - job_name: 'microservices'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
          - 'crm:8080'
          - 'employee:8080'
          - 'notification:8080'
          - 'resource:8080'
          - 'sale:8080'
          # - 'suggestion:8080'
          - 'user:8080'

