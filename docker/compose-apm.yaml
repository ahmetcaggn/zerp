name: zerp-frontend

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "127.0.0.1:9095:9090"
    user: root
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus # Prometheus verilerini saklamak için
    command: --config.file=/etc/prometheus/prometheus.yml
    networks:
      - zerp-net

  grafana:
    image: grafana/grafana:11.6.0
    volumes:
      # - /data/grafana:/var/lib/grafana
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:2000:3000"
    user: root
    depends_on:
      - prometheus
    networks:
      - zerp-net


networks:
  zerp-net:
    external: true

volumes:
  prometheus-data:
  grafana-data: