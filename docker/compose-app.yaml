    volumes:
      - ../zerp-backend/local/docker-config/gateway.docker.properties:/config/gateway.properties:ro
      - ./logs:/app/logs
    depends_on:
      - eureka
      - crm
      - employee
      - notification
      - resource
      - sale
      - user
    networks:
      - cloudflare_tunnel_network
      - zerp-net

networks:
  vpn-network:
    external: true
  cloudflare_tunnel_network:
    external: true
  zerp-net:
    external: true
