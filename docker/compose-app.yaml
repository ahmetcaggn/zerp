services:
  eureka:
    image: zerp-eureka:latest
    build:
      context: ..
      dockerfile: zerp-backend/docker/jre25.dockerfile
      args:
        SERVICE: eureka
        EXPOSE_PORT: 8761
    container_name: zerp-eureka
    hostname: eureka
    # deploy:
    #   resources:
    #     limits:
    #       memory: "256M"
    environment:
      TZ: Europe/Istanbul
      SERVICE: eureka
      MODULE_NAME: eureka
      SPRING_PROFILES_ACTIVE: ${EUREKA_SPRING_PROFILES_ACTIVE}
      LOG4J2_CONFIG_PATH: ${EUREKA_LOG4J2_CONFIG_PATH}
      JAVA_OPTS: ${EUREKA_JAVA_OPTS}
      spring.config.import: optional:file:/config/eureka.properties
    volumes:
      - ../zerp-backend/local/docker-config/eureka.docker.properties:/config/eureka.properties:ro
      - ./logs:/app/logs
    networks:
      - vpn-network
      - cloudflare_tunnel_network
      - zerp-net

  crm:
    image: zerp-crm:latest
    build:
      context: ..
      dockerfile: zerp-backend/docker/jre25.dockerfile
      args:
        SERVICE: crm
        JAR_FILE: zerp-backend/crm/target/*-exec.jar
    container_name: zerp-crm
    hostname: crm
    # deploy:
    #   resources:
    #     limits:
    #       memory: "512M"
    environment:
      TZ: Europe/Istanbul
      SERVICE: crm
      MODULE_NAME: crm
      SPRING_PROFILES_ACTIVE: ${CRM_SPRING_PROFILES_ACTIVE}
      LOG4J2_CONFIG_PATH: ${CRM_LOG4J2_CONFIG_PATH}
      JAVA_OPTS: ${CRM_JAVA_OPTS}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      EUREKA_DEFAULT_ZONE: ${EUREKA_DEFAULT_ZONE}
      app.image.baseUrl: ${IMAGE_SERVER_URL:-https://www.zerp.com/api}
      s3.repository.endpoint: http://minio:9000
      user.thumbor.host: http://thumbor:8888
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-zerp-images}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      THUMBOR_HOST: ${THUMBOR_HOST:-http://thumbor:8888}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-none}
      OPENAPI_SERVER_URLS: ${OPENAPI_SERVER_URLS}
      spring.config.import: optional:file:/config/crm.properties
    volumes:
      - ../zerp-backend/local/docker-config/crm.docker.properties:/config/crm.properties:ro
      - ./logs:/app/logs
    depends_on:
      - eureka
    networks:
      - zerp-net

