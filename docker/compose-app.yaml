  # suggestion service is not on use yet.

  user:
    image: zerp-user:latest
    build:
      context: ..
      dockerfile: zerp-backend/docker/jre25.dockerfile
      args:
        SERVICE: user
        JAR_FILE: zerp-backend/user/target/*-exec.jar
    container_name: zerp-user
    hostname: user
    # deploy:
    #   resources:
    #     limits:
    #       memory: "512M"
    environment:
      TZ: Europe/Istanbul
      SERVICE: user
      MODULE_NAME: user
      SPRING_PROFILES_ACTIVE: ${USER_SPRING_PROFILES_ACTIVE}
      LOG4J2_CONFIG_PATH: ${USER_LOG4J2_CONFIG_PATH}
      JAVA_OPTS: ${USER_JAVA_OPTS}
