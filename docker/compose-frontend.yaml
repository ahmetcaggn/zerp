name: zerp-frontend

services:
  zerp-admin:
    container_name: zerp-admin
    build:
      context: ../zerp-frontend/zerp-admin
      dockerfile: Dockerfile
    env_file:
      - ../zerp-frontend/zerp-admin/.env
    ports:
      - "3000:3000"

  zerp-tenant:
    container_name: zerp-tenant
    build:
      context: ../zerp-frontend/zerp-tenant
      dockerfile: Dockerfile
    env_file:
      - ../zerp-frontend/zerp-tenant/.env
    ports:
      - "3001:3000"

  zerp-client:
    container_name: zerp-client
    build:
      context: ../zerp-frontend/zerp-client
      dockerfile: Dockerfile
    env_file:
      - ../zerp-frontend/zerp-client/.env
    ports:
      - "3002:3000"

networks:
  zerp-frontend-net:
    name: zerp-frontend-net
    driver: bridge
