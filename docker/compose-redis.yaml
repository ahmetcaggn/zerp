services:
  redis:
    image: redis:alpine
    container_name: zerp-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: >
      redis-server 
      --appendonly yes  
      --notify-keyspace-events Ex
    networks:
      - zerp-net

networks:
  zerp-net:
    external: true

volumes:
  redis_data:
