services:
  eureka:
    image: zerp-eureka:latest
    build:
      context: ..
      dockerfile: zerp-backend/docker/jre25.dockerfile
      args:
        SERVICE: eureka
    container_name: zerp-eureka
    hostname: eureka
    environment:
      TZ: Europe/Istanbul
      SERVICE: eureka
      MODULE_NAME: eureka
      SPRING_PROFILES_ACTIVE: ${EUREKA_SPRING_PROFILES_ACTIVE}
      LOG4J2_CONFIG_PATH: ${EUREKA_LOG4J2_CONFIG_PATH}
      JAVA_OPTS: ${EUREKA_JAVA_OPTS}
      spring.config.import: optional:file:/config/eureka.properties
    volumes:
      - ../zerp-backend/local/docker-config/eureka.docker.properties:/config/eureka.properties:ro
    networks:
      - vpn-network
      - cloudflare_tunnel_network
      - zerp-net

  aggregated:
    image: zerp-aggregated:latest
    build:
      context: ..
      dockerfile: zerp-backend/docker/simple_jre25.dockerfile
      args:
        SERVICE: aggregated
    container_name: zerp-aggregated
    hostname: aggregated
    environment:
      TZ: Europe/Istanbul
      SPRING_PROFILES_ACTIVE: ${AGGREGATED_SPRING_PROFILES_ACTIVE}
      LOG4J2_CONFIG_PATH: ${AGGREGATED_LOG4J2_CONFIG_PATH}
      JAVA_OPTS: ${AGGREGATED_JAVA_OPTS}
      AGGREGATED_CONFIG_ROOT: ${AGGREGATED_CONFIG_ROOT}
      CRM_CONFIG_PATH: ${CRM_CONFIG_PATH}
      EMPLOYEE_CONFIG_PATH: ${EMPLOYEE_CONFIG_PATH}
      NOTIFICATION_CONFIG_PATH: ${NOTIFICATION_CONFIG_PATH}
      RESOURCE_CONFIG_PATH: ${RESOURCE_CONFIG_PATH}
      SALE_CONFIG_PATH: ${SALE_CONFIG_PATH}
      SUGGESTION_CONFIG_PATH: ${SUGGESTION_CONFIG_PATH}
      USER_CONFIG_PATH: ${USER_CONFIG_PATH}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      EUREKA_DEFAULT_ZONE: ${EUREKA_DEFAULT_ZONE}
      KAFKA_BOOTSTRAP: ${KAFKA_BOOTSTRAP}
      KAFKA_TOPIC_EMAIL: ${KAFKA_TOPIC_EMAIL}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-zerp-images}
      MINIO_CACHE_BUCKET_NAME: ${MINIO_CACHE_BUCKET_NAME:-zerp-images-thumbor-cache}
      THUMBOR_HOST: ${THUMBOR_HOST:-http://thumbor:8888}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      s3.repository.endpoint: ${MINIO_ENDPOINT:-http://minio:9000}
      s3.repository.bucket-name: ${MINIO_BUCKET_NAME:-zerp-images}
      s3.repository.username: ${MINIO_ROOT_USER:-admin}
      s3.repository.password: ${MINIO_ROOT_PASSWORD}
      user.thumbor.host: ${THUMBOR_HOST:-http://thumbor:8888}
      S3_REPOSITORY_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      S3_REPOSITORY_BUCKET_NAME: ${MINIO_BUCKET_NAME:-zerp-images}
      S3_REPOSITORY_USERNAME: ${MINIO_ROOT_USER:-admin}
      S3_REPOSITORY_PASSWORD: ${MINIO_ROOT_PASSWORD}
      USER_THUMBOR_HOST: ${THUMBOR_HOST:-http://thumbor:8888}
      PROMETHEUS_BASE_URL: ${PROMETHEUS_BASE_URL:-http://prometheus:9090}
      PROMETHEUS_MAX_RANGE_SECONDS: ${PROMETHEUS_MAX_RANGE_SECONDS:-604800}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI}
      KEYCLOAK_ADMIN_SERVER_URL: ${KEYCLOAK_ADMIN_SERVER_URL}
      KEYCLOAK_ADMIN_REALM: ${KEYCLOAK_ADMIN_REALM}
      KEYCLOAK_ADMIN_CLIENT_ID: ${KEYCLOAK_ADMIN_CLIENT_ID}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      OPENAPI_SERVER_URLS: ${OPENAPI_SERVER_URLS}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-none}
    depends_on:
      - eureka
    volumes:
      - ../zerp-backend/local/docker-config:/config:ro
    networks:
      - zerp-net

  gateway:
    image: zerp-gateway:latest
    build:
      context: ..
      dockerfile: zerp-backend/docker/jre25.dockerfile
      args:
        SERVICE: gateway
    container_name: zerp-gateway
    hostname: gateway
    environment:
      TZ: Europe/Istanbul
      SERVICE: gateway
      MODULE_NAME: gateway
      SPRING_PROFILES_ACTIVE: ${GATEWAY_SPRING_PROFILES_ACTIVE}
      LOG4J2_CONFIG_PATH: ${GATEWAY_LOG4J2_CONFIG_PATH}
      JAVA_OPTS: ${GATEWAY_JAVA_OPTS}
      EUREKA_DEFAULT_ZONE: ${EUREKA_DEFAULT_ZONE}
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI}
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN}
      spring.config.import: optional:file:/config/gateway.properties
    volumes:
      - ../zerp-backend/local/docker-config/gateway.docker.properties:/config/gateway.properties:ro
    depends_on:
      - eureka
      - aggregated
    networks:
      - cloudflare_tunnel_network
      - zerp-net

networks:
  vpn-network:
    external: true
  cloudflare_tunnel_network:
    external: true
  zerp-net:
    external: true
