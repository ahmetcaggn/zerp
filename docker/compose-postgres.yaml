services:
  postgres:
    image: postgres:17
    container_name: zerp-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - zerp-net

volumes:
  postgres_data:

networks:
  zerp-net:
    external: true
